    <main> 
        <div class="container">

            <form id="quizForm">
                <div class="etapa">

                <div class="etapa">
                    <p>2 - Qual o material do pote?</p>
                </div>
                <div class="quiza">
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2Vhv-xTdPAnnB9YVFi1_AXlIH-Fvj-Tq-dA&s">
                        <input type="radio" name="material" value="porcelana">
                        <p>PORCELANA</p>
                    </label>
                    <label class="card">
                        <img src="https://img.kalunga.com.br/fotosdeprodutos/148097z.jpg">
                        <input type="radio" name="material" value="plástico">
                        <p>PLÁSTICO</p>
                    </label>
                    <label class="card">
                        <img src="https://m.media-amazon.com/images/I/71R9ulQEiVL._AC_UF894,1000_QL80_.jpg">

                    </label>
                    <label class="card">
                        <img src="https://down-br.img.susercontent.com/file/br-11134207-7r98o-lsrm070o4w8484">

                    </label>
                    <label class="card">
                        <img src="https://http2.mlstatic.com/D_NQ_NP_886596-MLB70149251189_062023-O.webp">

                    </label>

                <div class="etapa">

                </div>
                <div class="quiza">

                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqqJ3oioFzLn5CDKriIzzZkpyq24pZeGakZQ&s">

                    </label>
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqT20ZtRq2PFEMdSyekurzw8HPAawExK6Z3Q&s">
                        <input type="radio" name="corpote" value="verdegarrafa">
                        <p>VERDE-GARRAFA</p>
                    </label>
                    <label class="card">

                        <input type="radio" name="corpote" value="vermelhosangue">
                        <p>VERMELHO-SANGUE</p>
                    </label>
                    <label class="card">
                        <img src="https://img.freepik.com/fotos-premium/textura-de-parede-amarela-fundo-de-parede-amarelo-quente-brilhante_523016-198.jpg">
                        <input type="radio" name="corpote" value="amareloindiano">
                        <p>AMARELO INDIANO</p>
                    </label>
                    <label class="card">
                        <img src="https://img.freepik.com/fotos-premium/fundo-vertical-azul-para-banner-poster-story-ad-celebrations-e-varios-trabalhos-de-design_7954-64001.jpg">

                <div class="etapa">

                </div>
                <div class="quiza">

                        <img src="https://www.arsfuneralis.com/3223/urna-di-metallo-rame.jpg">

                    </label>
                    <label class="card">
                        <img src="https://i.etsystatic.com/14232812/r/il/17bda3/2150875338/il_570xN.2150875338_gpbl.jpg">
                        <input type="radio" name="estilo" value="gotico">
                        <p>GÓTICO</p>
                    </label>
                    <label class="card">
                        <img src="https://cdn.ciadofermento.com.br/media/catalog/product/cache/1/image/1200x1200/9df78eab33525d08d6e5fb8d27136e95/p/r/primor_3_kg.jpg">

                    </label>
                    <label class="card">
                        <img src="https://cdn.leroymerlin.com.br/products/kit_vaso_sanitario_convencional_com_assento_thema_incepa_90904373_a6b3_600x600.jpg">

                <div class="botoes">
                    <button type="submit" class="buttom4">ENVIAR QUIZ</button>

            </form>

            <div class="botoes">
                <button type="button" id="alterar-senha" class="buttom">ALTERAR SENHA</button>
                <button type="button" id="deletar-conta" class="buttom2">DELETAR MINHA CONTA</button>
                <button type="submit" id="finalizar" class="buttom">CONSULTAR O PREÇO DO SEU PLANO</button>
            </div>

            <!-- CAIXA VER PRECO PLANO -->
            <div id="info-box" class="info-box"> 
                <h3>PREÇO DO SEU PLANO</h3>
                <p>1500R$</p>
            </div>

            <!-- CAIXA TROCAR SENHA -->
            <div id="info-box2" class="info-box2" style="display: none;"> 
                <form id="form-alterar-senha">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

                    <label for="senha-antiga">Senha Antiga:</label>
                    <input type="password" id="senha-antiga" name="senha-antiga" placeholder="Digite sua senha antiga" required><br><br>
                    
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite sua nova senha" required><br><br>
                    
                    <label for="confirmar-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua nova senha" required><br><br>
                    
                    <button type="submit" class="buttom">ALTERAR SENHA</button>
                </form>
            </div>

            <!-- CAIXA TROCAR SENHA VERIFICAÇÃO-->
            <div id="info-box3" class="info-box3" style="display:none;">
                <p>Tem certeza que deseja deletar sua conta?</p>
                <button type="button" id="confirmar-sim" class="buttom">SIM</button>
                <button type="button" id="confirmar-nao" class="buttom2">NÃO</button>
            </div>
        </div>
    </main>

    <script type="module">
        import * as funcao from '../js/funcoes.js'; // Importa as funções necessárias

        document.getElementById("quizForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário

            // Captura os dados do formulário
            const formData = new FormData(event.target);
            const respostas = {};
            const user_id = sessionStorage.getItem("user_id");

            // Converte os dados em um objeto JavaScript
            for (const [key, value] of formData.entries()) {
                respostas[key] = value;
            }

            // Exibe as respostas no console para teste
            console.log("Respostas do Quiz:", respostas);

            // Cria o objeto plano
            const plano = {
                user_id: user_id,
                tipo_rito: 1 // 1 para cremação
            };

            try {
                // Chama a função para criar o plano
                const plano_id = await criarPlano(plano);
                console.log("Plano criado com ID:", plano_id);
                // Armazenar o user_id no sessionStorage
                sessionStorage.setItem("plano_id", plano_id);

                // Cria o objeto detalhesCremacao
                const detalhesCremacao = {
                    plano_id: plano_id,
                    cor_das_cinzas: respostas.cor,
                    material_pote: respostas.material,
                    cor_do_pote: respostas.corpote,
                    estilo_pote: respostas.estilo
                };

                console.log("Detalhes da cremação a serem enviados:", detalhesCremacao);

                // Chama a função para inserir os detalhes da cremação
                const result = await inserirDetalhesCremacao(detalhesCremacao);
                console.log("Detalhes da cremação inseridos:", result);

                // Exibe mensagem de sucesso
                alert("Quiz enviado com sucesso!");
            } catch (error) {
                console.error("Erro ao processar o quiz:", error);
                alert("Erro ao enviar o quiz. Tente novamente.");
            }
        });
        
        document.getElementById("form-alterar-senha").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const senhaAntiga = document.getElementById("senha-antiga").value;
            const novaSenha = document.getElementById("nova-senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;
    
            if (novaSenha !== confirmarSenha) {
                alert("As senhas não coincidem. Tente novamente.");
                return;
            }
    
            try {
                const usuario = {
                    email: email,
                    senha: novaSenha
                };
    
                console.log("Dados para atualizar senha:", usuario); // Verifique os dados
    
                const resultado = await funcao.atualizarSenha(usuario);
                console.log("Resposta da API:", resultado);
                alert("Senha alterada com sucesso!");
            } catch (error) {
                console.error("Erro ao alterar senha:", error);
                alert("Erro ao alterar senha. Tente novamente.");
            }
        });
    
        document.getElementById("confirmar-sim").addEventListener("click", async function(event) {
            const user_id = sessionStorage.getItem("user_id");
    
            try {
                console.log("User ID para deletar:", user_id);
    
                const resultado = await funcao.excluirUsuario(user_id);
                console.log("Resposta da API:", resultado);
                alert("Conta deletada com sucesso!");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Erro ao deletar conta:", error);
                alert("Erro ao deletar conta. Tente novamente.");
            }
        });

        document.getElementById("deletar-conta").addEventListener("click", function (event) {
            event.preventDefault();
            var confirmarDeletar = document.getElementById("info-box3");
            if (confirmarDeletar.style.display === "none" || confirmarDeletar.style.display === "") {
                confirmarDeletar.style.display = "block";
            } else {
                confirmarDeletar.style.display = "none";
            }
        });

        document.getElementById("confirmar-nao").addEventListener("click", function () {
            var confirmarDeletar = document.getElementById("info-box3");
            confirmarDeletar.style.display = "none";
        });

        document.getElementById("finalizar").addEventListener("click", function (event) {
            event.preventDefault(); 
            var infoBox = document.getElementById("info-box");
            if (infoBox.style.display === "none") {
                infoBox.style.display = "block";
            } else {
                infoBox.style.display = "none";
            }
        });

        document.getElementById("alterar-senha").addEventListener("click", function (event) {
            event.preventDefault();
            var infoBox2 = document.getElementById("info-box2");
            if (infoBox2.style.display === "none") {
                infoBox2.style.display = "block";
            } else {
                infoBox2.style.display = "none";
            }
        });

        document.getElementById("form-alterar-senha").addEventListener("submit", function(event) {
            event.preventDefault();
            
            var senhaAntiga = document.getElementById("senha-antiga").value;
            var novaSenha = document.getElementById("nova-senha").value;
            var confirmarSenha = document.getElementById("confirmar-senha").value;

            if (novaSenha !== confirmarSenha) {
                alert("As senhas não coincidem. Tente novamente.");
                return;
            }

            alert("Senha alterada com sucesso!");
        });
    </script>
</body>
