<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="./css/quize.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="https://i.pinimg.com/736x/f0/aa/79/f0aa7915b312f4da215c49d01b9ce3c9.jpg" alt="JARDIM DA SAUDADE">
            <span class="titulo">JARDIM DA SAUDADE</span>
        </div>

        <nav class="cabecalho">
            <a href="tela_inicial.html">Início</a>
            <a href="fale.html">Fale conosco</a>
            <a href="login.html">Área do cliente</a>
        </nav>
    </header>

    <main> 
        <div class="container">
            <form id="quizForm" class="quizform" >

                <div class="etapa">
                    <p>1 - Qual será a cor do caixão?</p>
                </div>           
                <div class="quiza">
                    <label class="card">
                        <img src="https://img.freepik.com/fotos-gratis/plano-de-fundo-texturizado-de-parede-de-concreto-solido_53876-101635.jpg">
                        <input type="radio" name="cor" value="preto">
                        <p>PRETO</p>
                    </label>
                    <label class="card">
                        <img src="https://img.freepik.com/fotos-premium/textura-do-papel-branco_392895-563434.jpg?semt=ais_hybrid">
                        <input type="radio" name="cor" value="branco">
                        <p>BRANCO</p>
                    </label>
                    <label class="card">
                        <img src="https://54337.cdn.simplo7.net/static/54337/sku/tricoline-tecido-tricoline-lisa-ros100-algodao-com-1-50-lg--p-1608636585193.jpeg">
                        <input type="radio" name="cor" value="rosa">
                        <p>ROSA</p>
                    </label>
                    <label class="card">
                        <img src="https://41446.cdn.simplo7.net/static/41446/sku/tricoline-lisa-tricoline-lisa-marrom--p-1563376571799.jpg">
                        <input type="radio" name="cor" value="marrom">
                        <p>MARROM</p>
                    </label>
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTs1npK7tE42djXEvI4ML7eCu3uEDP4cUsh4g&s">
                        <input type="radio" name="cor" value="mocha">
                        <p>MOCHA MOUSSE</p>
                    </label>
                </div>

                <div class="etapa">
                    <p>2 - Qual o material do caixão?</p>
                </div>
                <div class="quiza">
                    <label class="card">
                        <img src="https://funeraria.redememorialfortaleza.com.br/imagens/quanto-custa-caixao-de-madeira-preto.jpg">
                        <input type="radio" name="material" value="madeira">
                        <p>MADEIRA</p>
                    </label>
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhxhNfHSLt6eETV0Gncba5tD8v_0P2T0n6xEfuJADEPoF_KvplgpFkM9Dth1uVrE6WRKI&usqp=CAU">
                        <input type="radio" name="material" value="chumbo">
                        <p>CHUMBO</p>
                    </label>
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyA2ERpb3srDKnNBPtwuajD7yMmskbwbG1AQ&s">
                        <input type="radio" name="material" value="vidro">
                        <p>VIDRO</p>
                    </label>
                    <label class="card">
                        <img src="https://images.tcdn.com.br/img/img_prod/694926/saco_de_lixo_preto_100_litros_reforcado_saquitel_70003_1_2e7724e5de4bc663a80acbf0d821660b.jpg">
                        <input type="radio" name="material" value="saco">
                        <p>SACO DE LIXO</p>
                    </label>
                    <label class="card">
                        <img src="https://cdn.awsli.com.br/600x1000/162/162402/produto/4572835/0546b6b56e.jpg">
                        <input type="radio" name="material" value="papelao">
                        <p>PAPELÃO</p>
                    </label>
                </div>

                <div class="etapa">
                    <p>3 - Qual o estilo do caixão?</p>
                </div>
                <div class="quiza">
                    <label class="card">
                        <img src="https://img.freepik.com/fotos-premium/caixao-gotico-vintage-em-ilustracao-de-gravura-em-madeira-com-tema-escuro_886588-72278.jpg">
                        <input type="radio" name="estilo" value="gotico">
                        <p>GÓTICO</p>
                    </label>
                    <label class="card">
                        <img src="https://png.pngtree.com/png-clipart/20241102/original/pngtree-kawaii-halloween-coffin-pixar-style-png-image_16645127.png">
                        <input type="radio" name="estilo" value="kawaii">
                        <p>KAWAII</p>
                    </label>
                    <label class="card">
                        <img src="https://i.ytimg.com/vi/1n89JvbO6_g/maxresdefault.jpg">
                        <input type="radio" name="estilo" value="potemargarina">
                        <p>POTE DE MARGARINA</p>
                    </label>
                    <label class="card">
                        <img src="https://i.gifer.com/fetch/w300-preview/19/19e07502d8e4b0e88346caaa35fdc792.gif">
                        <input type="radio" name="estilo" value="bobesponja">
                        <p>BOB ESPONJA</p>
                    </label>
                    <label class="card">
                        <img src="https://i.ytimg.com/vi/4mYFg1BYpsQ/hq2.jpg">
                        <input type="radio" name="estilo" value="caixasom">
                        <p>CAIXINHA DE SOM</p>
                    </label>
                </div>

                <div class="etapa">
                    <p>4 - Como será sua lápide?</p>
                </div>
                <div class="quiza">
                    <label class="card">
                        <img src="https://i.pinimg.com/736x/f0/a5/14/f0a514aa2ee8eb0db9374f58b8ed18b1.jpg">
                        <input type="radio" name="lapide" value="informatico">
                        <p>INFORMÁTICO</p>
                    </label>
                    <label class="card">
                        <img src="https://i.pinimg.com/736x/bb/39/e5/bb39e5897339b1d5718a004089162746.jpg">
                        <input type="radio" name="lapide" value="loira">
                        <p>LOIRA DESCONHECIDA</p>
                    </label>
                    <label class="card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsB8Eehw4Mgkl8-wTSnLvgwFr3XPeOHBJ-2Q&s">
                        <input type="radio" name="lapide" value="offline">
                        <p>OFFLINE</p>
                    </label>
                    <label class="card">
                        <img src="https://wl-incrivel.cf.tsp.li/resize/728x/webp/b90/63e/4a1ad65b9f9d37fe2e2a5cbbe6.jpg.webp">
                        <input type="radio" name="lapide" value="ouija">
                        <p>OUIJA</p>
                    </label>
                    <label class="card">
                        <img src="https://i.pinimg.com/474x/f8/51/c3/f851c30084e1f195c6c29be2720f55b8.jpg">
                        <input type="radio" name="lapide" value="raiva">
                        <p>MORREU DE RAIVA</p>
                    </label>
                </div>
     
                <div class="botoes">
                    <button type="submit" class="buttom">ENVIAR QUIZ</button>
                </div>
            </form>

            <div class="botoes">
                <button type="button" id="alterar-senha" class="buttom">ALTERAR SENHA</button>
                <button type="button" id="deletar-conta" class="buttom">DELETAR MINHA CONTA</button>
                <button type="submit" id="finalizar" class="buttom">CONSULTAR O PREÇO DO SEU PLANO</button>
            </div>

            <div id="info-box" class="info-box"> 
                <h3>PREÇO DO SEU PLANO</h3>
                <p>1000R$</p>
            </div>

            <div id="info-box2" class="info-box2" style="display: none;"> 
                <form id="form-alterar-senha">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>
            
                    <label for="senha-antiga">Senha Antiga:</label>
                    <input type="password" id="senha-antiga" name="senha-antiga" placeholder="Digite sua senha antiga" required><br><br>
            
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite sua nova senha" required><br><br>
            
                    <label for="confirmar-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua nova senha" required><br><br>
            
                    <button type="submit" class="buttom">ALTERAR SENHA</button>
                </form>
            </div>

            <div id="info-box3" class="info-box3" style="display:none;">
                <p>Tem certeza que deseja deletar sua conta?</p>
                <button type="button" id="confirmar-sim" class="buttom">SIM</button>
                <button type="button" id="confirmar-nao" class="buttom">NÃO</button>
            </div>
        </div>
    </main>
    <script type="module">
        import * as funcao from '../js/funcoes.js';
    
        // Função de envio do quiz
        document.getElementById("quizForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const respostas = {};
            const user_id = sessionStorage.getItem("user_id");
    
            console.log("User ID:", user_id); // Verifique se o user_id está correto
    
            for (const [key, value] of formData.entries()) {
                respostas[key] = value;
            }
    
            console.log("Respostas do Quiz:", respostas); // Verifique as respostas
    
            const plano = {
                user_id: user_id,
                tipo_rito: 0
            };
    
            try {
                const plano_id = await funcao.criarPlano(plano);
                console.log("Plano criado com ID:", plano_id);
                sessionStorage.setItem("plano_id", plano_id);
    
                const detalhesEnterro = {
                    plano_id: plano_id,
                    cor_caixao: respostas.cor,
                    material_caixao: respostas.material,
                    estilo_caixao: respostas.estilo,
                    tipo_lapide: respostas.lapide
                };
    
                console.log("Detalhes do Enterro:", detalhesEnterro); // Verifique os detalhes
    
                const result = await funcao.inserirDetalhesEnterro(detalhesEnterro);
                console.log("Detalhes do enterro inseridos:", result);
                alert("Quiz enviado com sucesso!");
            } catch (error) {
                console.error("Erro ao processar o quiz:", error);
                alert("Erro ao enviar o quiz. Tente novamente.");
            }
        });
    
        // Função de alterar senha
        document.getElementById("form-alterar-senha").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const senhaAntiga = document.getElementById("senha-antiga").value;
            const novaSenha = document.getElementById("nova-senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;
    
            if (novaSenha !== confirmarSenha) {
                alert("As senhas não coincidem. Tente novamente.");
                return;
            }
    
            try {
                const usuario = {
                    email: email,
                    senha: novaSenha
                };
    
                console.log("Dados para atualizar senha:", usuario); // Verifique os dados
    
                const resultado = await funcao.atualizarSenha(usuario);
                console.log("Resposta da API:", resultado);
                alert("Senha alterada com sucesso!");
            } catch (error) {
                console.error("Erro ao alterar senha:", error);
                alert("Erro ao alterar senha. Tente novamente.");
            }
        });
    
        // Função de deletar conta
        document.getElementById("confirmar-sim").addEventListener("click", async function(event) {
            const user_id = sessionStorage.getItem("user_id");
    
            try {
                console.log("User ID para deletar:", user_id); // Verifique o user_id
    
                const resultado = await funcao.excluirUsuario(user_id);
                console.log("Resposta da API:", resultado);
                alert("Conta deletada com sucesso!");
                window.location.href = "login.html"; // Redireciona para a tela de login
            } catch (error) {
                console.error("Erro ao deletar conta:", error);
                alert("Erro ao deletar conta. Tente novamente.");
            }
        });
    
        // Restante do código para exibir/ocultar caixas de diálogo
        document.getElementById("deletar-conta").addEventListener("click", function(event) {
            event.preventDefault();
            var confirmarDeletar = document.getElementById("info-box3");
            if (confirmarDeletar.style.display === "none" || confirmarDeletar.style.display === "") {
                confirmarDeletar.style.display = "block";
            } else {
                confirmarDeletar.style.display = "none";
            }
        });
    
        document.getElementById("confirmar-nao").addEventListener("click", function() {
            var confirmarDeletar = document.getElementById("info-box3");
            confirmarDeletar.style.display = "none";
        });
    
        document.getElementById("finalizar").addEventListener("click", function(event) {
            event.preventDefault(); 
            var infoBox = document.getElementById("info-box");
            if (infoBox.style.display === "none") {
                infoBox.style.display = "block";
            } else {
                infoBox.style.display = "none";
            }
        });
    
        document.getElementById("alterar-senha").addEventListener("click", function(event) {
            event.preventDefault();
            var infoBox2 = document.getElementById("info-box2");
            if (infoBox2.style.display === "none") {
                infoBox2.style.display = "block";
            } else {
                infoBox2.style.display = "none";
            }
        });
    </script>
</body>
</html>
